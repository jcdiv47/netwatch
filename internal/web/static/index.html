<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>netwatch</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="#/">netwatch</a>
  <nav>
    <a href="#/" data-nav="devices">Devices</a>
    <a href="#/domains" data-nav="domains">Domains</a>
    <a href="#/live" data-nav="live">Live</a>
  </nav>
  <div class="range" id="range" role="group" aria-label="Time range">
    <button data-r="6h">6h</button><button data-r="24h">24h</button><button data-r="7d">7d</button><button data-r="30d">30d</button><button data-r="90d">90d</button><button data-r="365d">1y</button>
  </div>
  <span id="status" class="status" title="collector status"></span>
</header>
<main id="main"><p class="muted">Loading…</p></main>
<div id="tip" class="tip" hidden></div>
<script src="app.js"></script>
</body>
</html>
